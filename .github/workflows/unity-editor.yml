# Compiles the package the way a consumer's editor does, and records where a given
# platform keeps the editor's bundled .NET runtime.
#
# Why this exists: test.yml's `gates` job runs unity-compile-check.mjs, which builds
# Shared/ + Runtime/ in a standalone csproj -- fast, no licence, and unable to reach
# Editor/ or Builder/. Ruitk.Editor references Ruitk.Ugui, Ruitk.Ugui needs
# UnityEngine.UI and Unity.TextMeshPro, and those live in a PROJECT's package cache
# rather than the editor install, so the cheap route stops at the assembly boundary.
# Everything under Editor/ (HMR, the asset registry, the csproj postprocessor) and
# everything under Builder/ therefore has zero compile coverage today. Both instances
# of #254 were in Editor/; #256 was three Editor-assembly files with no .meta, which
# shows up here as an asmdef that produced no assembly at all.
#
# It does NOT run on push or pull_request. It is a release gate and an on-demand
# check: publish.yml calls it before anything ships, and it can be dispatched by hand.
# That keeps it off the per-PR path, where a full editor import per push is a lot of
# CI for a tree that test.yml's gates job already compile-checks.
#
# Needs UNITY_EMAIL + UNITY_PASSWORD (a Unity ID WITHOUT two-factor auth - headless
# activation cannot answer a 2FA prompt); a run activates a named-user seat and
# returns it afterwards. Without the secrets every job prints a notice and passes.
# Verify the credentials with the "Unity license check" workflow.
name: Unity editor

on:
  # Two entry points, one definition. publish.yml calls this workflow so that no
  # release ships a package that does not compile in a real editor; the dispatch
  # form is for running it by hand between releases.
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Also run the macOS layout job (installs a macOS editor - slow)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      include_macos:
        description: "Also run the macOS layout job"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # ── Every asmdef compiles, in a real editor ────────────────────────────────
  editor-compile:
    name: editor-compile
    runs-on: ubuntu-latest
    env:
      # Keep in lockstep with publish.yml's build-unitypackage and
      # unity-license-check.yml -- one editor version across every Unity-in-CI lane.
      UNITY_VERSION: "6000.2.6f1"
      HAS_LICENSE: ${{ secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check licence arming
        id: check
        run: |
          if [ "$HAS_LICENSE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unity editor compile::INERT -- add UNITY_EMAIL + UNITY_PASSWORD repo secrets (a no-2FA Unity ID) to arm it; verify with the Unity license check workflow."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Ubuntu 22.04's default nodejs package is Node 12, which predates the
      # nullish-coalescing operator. The check scripts use it, so the container died with
      # a SyntaxError before Unity was ever asked to do anything. Install a supported Node
      # instead of writing the scripts down to an EOL runtime, and pin the major so a
      # future image change cannot move it.
      #
      # KEEP PROSE OUT OF THE bash -lc BLOCK BELOW. Inside a single-quoted argument, a "#"
      # line is not a comment -- it is string content. One apostrophe in it terminates the
      # quote and the rest of the script runs on the RUNNER instead of in the container;
      # a backtick in it becomes command substitution. Both happened here once.
      - name: Compile every asmdef in a shell project
        if: steps.check.outputs.skip == 'false'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -e
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            unityci/editor:ubuntu-${UNITY_VERSION}-base-3 \
            bash -lc '
              set -e
              trap "unity-editor -batchmode -nographics -quit -returnlicense -username \"$UNITY_EMAIL\" -password \"$UNITY_PASSWORD\" -logFile - || true" EXIT

              apt-get update -qq
              apt-get install -y -qq --no-install-recommends curl ca-certificates
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y -qq --no-install-recommends nodejs
              node --version

              unity-editor -batchmode -nographics -quit \
                -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
                -createProject /tmp/licence-warmup -logFile - > /dev/null

              RUITK_UNITY_EXE=unity-editor node scripts/unity-editor-compile.mjs --clean
            '

  # ── Where does this platform keep the bundled runtime? ─────────────────────
  #
  # #255: HMR computed the editor's data directory as
  # `dirname(EditorApplication.applicationPath) + "/Data"`, which is the Windows
  # install shape, so it could not start on macOS. The fix probes
  # EditorApplication.applicationContentsPath -- Unity's own answer, correct on every
  # platform -- and falls back through a list of candidate subdirectories, so it no
  # longer depends on knowing any particular layout.
  #
  # This job records the layout as FACT rather than as the issue's assertion, and
  # guards the next Windows-only path assumption. It is opt-in via include_macos,
  # and off by default even on publish: macos runners have no Unity preinstalled, so
  # every run pays for an editor install. Run it once per Unity major.
  macos-layout:
    name: macos-layout
    if: inputs.include_macos
    runs-on: macos-latest
    env:
      UNITY_VERSION: "6000.2.6f1"
      HAS_LICENSE: ${{ secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check licence arming
        id: check
        run: |
          if [ "$HAS_LICENSE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=macOS layout::INERT -- needs UNITY_EMAIL + UNITY_PASSWORD."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # game-ci/unity-builder is NOT used here, and that is deliberate. It requires a .ulf
      # licence file (UNITY_LICENSE) or a Pro serial (UNITY_SERIAL); it cannot do the
      # named-user email+password activation that a Personal licence needs, and Unity
      # discontinued manual .ulf activation for Personal. The Linux job already activates
      # the same way this does, so the licence model is consistent across both.
      #
      # The changeset is LOOKED UP, not pinned. Unity Hub needs version AND changeset to
      # install a specific editor, and a second hardcoded constant is a second thing to
      # forget when UNITY_VERSION moves. services.api.unity.com reports it as
      # shortRevision for the version we already name.
      - name: Install the Unity editor via Hub
        if: steps.check.outputs.skip == 'false'
        run: |
          set -e
          brew install --cask unity-hub

          CHANGESET=$(curl -fsSL "https://services.api.unity.com/unity/editor/release/v1/releases?version=${UNITY_VERSION}&limit=1" | jq -r ".results[0].shortRevision // empty")
          if [ -z "$CHANGESET" ]; then
            echo "::error::Could not resolve a changeset for ${UNITY_VERSION} from the Unity release API."
            exit 1
          fi
          echo "changeset: $CHANGESET"

          HUB="/Applications/Unity Hub.app/Contents/MacOS/Unity Hub"
          "$HUB" -- --headless install --version "${UNITY_VERSION}" --changeset "$CHANGESET" || true

          # The Hub CLI hands the download to its background process and returns straight
          # away, so the exit code says nothing about whether the editor arrived. Wait for
          # the binary instead of trusting it.
          EDITOR="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          for i in $(seq 1 120); do
            if [ -x "$EDITOR" ]; then break; fi
            sleep 15
          done
          if [ ! -x "$EDITOR" ]; then
            echo "::error::The editor never appeared at $EDITOR after 30 minutes."
            ls -la "/Applications/Unity/Hub/Editor" || true
            exit 1
          fi
          echo "editor: $EDITOR"
          echo "RUITK_UNITY_EXE=$EDITOR" >> "$GITHUB_ENV"

      # The whole point of this job: run the SHIPPED locator on macOS and print where it
      # found the bundled runtime. Exits 0 found, 1 not found, 2 threw -- and "threw" is
      # how the 0.21.0 regression presented, so a not-found check alone would have missed it.
      - name: Probe the bundled runtime with the shipped locator
        if: steps.check.outputs.skip == 'false'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -e
          mkdir -p /tmp/probe/Assets /tmp/probe/ProjectSettings
          echo "m_EditorVersion: ${UNITY_VERSION}" > /tmp/probe/ProjectSettings/ProjectVersion.txt

          # One run. The log goes to a file rather than a pipe so the exit code the method
          # sets reaches the shell; piping into grep would hand back grep's status instead.
          set +e
          "$RUITK_UNITY_EXE" -batchmode -nographics -quit \
            -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
            -projectPath /tmp/probe \
            -executeMethod Ruitk.CICD.BundledRuntimeReport.Run \
            -logFile /tmp/probe/probe.log
          code=$?
          set -e
          grep -E "RUNTIME-PROBE|error CS" /tmp/probe/probe.log || true
          exit $code

      - name: Compile every asmdef on macOS
        if: steps.check.outputs.skip == 'false'
        run: node scripts/unity-editor-compile.mjs --clean

      # A leaked activation blocks the next run, and there is one seat. always() so it is
      # returned even when the probe above fails, which is the case that matters.
      - name: Return the licence
        if: always() && steps.check.outputs.skip == 'false' && env.RUITK_UNITY_EXE != ''
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          "$RUITK_UNITY_EXE" -batchmode -nographics -quit -returnlicense \
            -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -logFile - || true
