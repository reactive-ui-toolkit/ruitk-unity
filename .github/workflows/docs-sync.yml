name: Docs sync

# Build ReactiveUIToolkitDocs~ and push it into the family documentation site's /unity/ folder
# (reactive-ui-toolkit/documentation, which is what reactiveuitoolkit.info serves).
#
# Each leg owns its own folder there and nothing else, so the three legs never touch the same
# files — that is what makes the push-with-rebase-retry below safe under concurrent publishes.
#
# Deliberately a SEPARATE workflow from publish.yml, and dispatch-only: syncing docs must never
# require running a release, and testing this must never risk cutting one. publish.yml can call
# it later via `workflow_call`.
#
# Requires secret DOCUMENTATION_SYNC_PATS: a fine-grained PAT whose resource owner is the
# reactive-ui-toolkit org, scoped to the `documentation` repo, with Contents: read and write.

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      DOCUMENTATION_SYNC_PATS:
        required: true

permissions:
  contents: read

concurrency:
  group: docs-sync
  cancel-in-progress: false

env:
  AGG_REPO: reactive-ui-toolkit/documentation
  LEG_DIR: unity
  DOCS_DIR: ReactiveUIToolkitDocs~

jobs:
  sync:
    name: Build docs + push to the family site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ${{ env.DOCS_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.DOCS_DIR }}
        run: npm run build

      - name: Guard — the build must match the folder it is served from
        # vite.config.ts `base` is baked into every asset URL at build time. If it drifts from
        # /unity/, the deployed site loads a blank page with 404s on its own JS/CSS -- and it
        # would deploy perfectly happily. Cheaper to fail here than to debug it live.
        run: |
          if ! grep -q '"\?/${{ env.LEG_DIR }}/' "${DOCS_DIR}/dist/index.html"; then
            echo "::error::dist/index.html does not reference /${{ env.LEG_DIR }}/ — check vite.config.ts base"
            grep -o 'src="[^"]*"\|href="[^"]*"' "${DOCS_DIR}/dist/index.html" | head -20
            exit 1
          fi
          echo "OK: assets are base-prefixed with /${{ env.LEG_DIR }}/"

      - name: Guard — no hand-written absolute asset URLs
        # Vite only rewrites asset URLs it PROCESSES: attributes in index.html, and imports the
        # bundler resolves. A literal like src="/logo.png" in a .tsx is emitted VERBATIM, so under
        # base=/unity/ it points at the domain root, 404s on the live site, and builds perfectly
        # happily -- which is how the site logo and the first UI Builder screenshots shipped broken.
        # Images belong in src/assets and must be imported; then Vite hashes them, prefixes them,
        # and a wrong path is a BUILD error instead of a silent 404.
        run: |
          set -euo pipefail
          hits=$(cat "${DOCS_DIR}"/dist/assets/*.js \
            | grep -ohE '["`]/[A-Za-z0-9_./-]+\.(png|jpe?g|gif|svg|webp|ico|woff2?)["`]' \
            | grep -v '^["`]/${{ env.LEG_DIR }}/' | sort -u || true)
          if [ -n "$hits" ]; then
            echo "::error::asset URLs that bypass the base prefix -- import them from src/assets instead:"
            echo "$hits"
            exit 1
          fi
          echo "OK: every absolute asset URL in the bundle is base-prefixed"

      - name: Push into the family documentation site
        env:
          TOKEN: ${{ secrets.DOCUMENTATION_SYNC_PATS }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${AGG_REPO}.git" _agg
          cd _agg
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Replace the folder wholesale so files deleted upstream don't linger.
          rm -rf "${LEG_DIR}"
          mkdir -p "${LEG_DIR}"
          cp -r "../${DOCS_DIR}/dist/." "${LEG_DIR}/"

          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes to publish."
            exit 0
          fi
          git commit -m "docs(${LEG_DIR}): sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"

          # Legs write disjoint folders, so a rebase is effectively always conflict-free; the
          # retry exists for the plain race of two legs pushing within the same few seconds.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto the latest main."
            git pull --rebase origin main
          done
          echo "::error::could not push to ${AGG_REPO} after 5 attempts"
          exit 1
